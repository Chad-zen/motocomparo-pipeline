# Niveau server : inclus dans le bloc 443 de motocomparo (voir 09-durcissement.sh).
#
# Audit du 30/09/2026.

if ($mc_robot_refuse) {
    return 403;
}

# Herite par toutes les locations, /static/ compris mais sans cle (voir http).
limit_req zone=mc_site burst=40 nodelay;
# Un seul debit par famille de robot d'IA, toutes adresses confondues (voir http).
limit_req zone=mc_robots_ia burst=10 nodelay;
limit_req zone=mc_robots_recherche burst=20 nodelay;
limit_req zone=mc_robots_seo burst=5 nodelay;
limit_req_status 429;

# Niveau 1 par defaut : 10 a 15 % de plus sur le CSS et le JS au niveau 6.
# Vary evite qu'un cache intermediaire serve la version compressee a un client
# qui ne la lit pas.
gzip_comp_level 6;
gzip_vary on;

# Le tableau de bord ne passe JAMAIS par le cache : la cle du cache ignore
# l'adresse et l'en-tete Authorization, la premiere page servie a une personne
# autorisee l'aurait ete a tout le monde pendant une heure.
location ^~ /admin {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    client_max_body_size 16k;
}

# Le formulaire de contact : debit limite en POST, corps borne, pas de cache
# (la page confirme un envoi, elle ne doit pas etre servie a un autre).
location = /contact {
    limit_req zone=mc_contact burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# Le formulaire d'alerte de prix : seule la demande initiale (POST /alertes)
# envoie un e-mail, donc seule elle est limitee en debit ici. Les pages ou
# menent les liens des e-mails (confirmer, arreter, tout-supprimer) vivent
# sous /alertes/ et n'envoient rien de plus ; elles restent sous la limite
# generale des PAGES (zone mc_site) mais hors cache, l'application l'ecrivant
# elle-meme (Cache-Control: no-store sur ces reponses).
location = /alertes {
    limit_req zone=mc_alertes burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

location ^~ /alertes/ {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
