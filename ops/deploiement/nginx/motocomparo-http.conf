# Niveau http : a copier dans /etc/nginx/conf.d/ (voir 09-durcissement.sh).
#
# Audit du 30/09/2026.

# La version exacte de nginx et de l'OS sortait dans chaque en-tete Server et
# chaque page d'erreur.
server_tokens off;

# Formulaire de contact : 3 envois par minute et par adresse, POST seulement.
# Une cle vide n'est pas comptee, donc les GET ne sont jamais freines.
map $request_method $mc_cle_contact {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $mc_cle_contact zone=mc_contact:1m rate=3r/m;

# L'alerte de baisse de prix : même principe que le contact, un peu plus
# permissif (une adresse peut suivre plusieurs fiches de suite). L'ANTI-ABUS
# PAR ADRESSE reste dans l'application (`mcpipe.alertes`, 20 alertes et
# 5 demandes de confirmation par 24 h) ; cette zone protège contre le volume
# par ADRESSE IP, avant même que l'application ne lise quoi que ce soit.
limit_req_zone $mc_cle_contact zone=mc_alertes:1m rate=10r/m;

# Les PAGES : 10 par seconde et par adresse, rafale de 40. Une page de filtres
# pas encore en cache coute plusieurs secondes de base ; quelques robots
# suffisaient a epuiser les 6 connexions du site pour tout le monde. Les
# fichiers de /static/ ne sont pas comptes (cle vide) : une page en charge une
# trentaine d'un coup.
map $uri $mc_cle_site {
    ~^/static/  "";
    default     $binary_remote_addr;
}
limit_req_zone $mc_cle_site zone=mc_site:10m rate=10r/s;

# Le robot d'entrainement de Meta explorait les combinaisons de filtres sans
# fin : pres de la moitie des requetes, pool de connexions epuise, 500 et 504
# pour les vrais visiteurs. Il n'amene aucun visiteur.
#
# Son cousin meta-webindexer (le moteur de recherche de Meta) faisait la meme
# chose apres coup : 160 pages filtrees sur 400 requetes. Lui peut amener des
# visiteurs : il garde les pages propres, seules les adresses a parametres
# (filtres, tri, pages) lui sont refusees. facebookexternalhit, l'apercu d'un
# lien partage sur Facebook, n'est pas touche.
#
# PerplexityBot (15/10/2026) : meme profil que meta-webindexer, par IP AWS
# tournantes -- 1271 requetes sur les 3000 dernieres lignes de log, pool de
# connexions epuise, pages de filtres lentes ou en 503 pour les vraies
# personnes. Meme traitement : seules les adresses a parametres lui sont
# refusees, les fiches et rayons propres restent ouverts.
map "$http_user_agent|$args" $mc_robot_refuse {
    default                          0;
    ~*meta-externalagent             1;
    "~*meta-webindexer.*\|.+"        1;
    "~*perplexitybot.*\|.+"          1;
}

# Les robots d'IA ont UN compteur par famille, pas un par adresse. Bloques sur
# les filtres, ils sont passes aux fiches produit (15/10/2026, une heure apres) :
# PerplexityBot 754, ClaudeBot 427, Bytespider 81 sur 2000 requetes, charge a 5
# sur un seul processeur, 185 reponses 503 aux vraies personnes. Chaque robot
# tourne sur des dizaines d'adresses : la limite par adresse (mc_site) ne les
# voyait jamais. Ici toutes les adresses d'un meme robot partagent un seul
# debit -- 30 pages par minute, rafale de 10 -- au-dela, 429, que ces robots
# respectent en ralentissant. Googlebot, Bing, Applebot et l'apercu Facebook
# n'y sont pas : ils amenent des visiteurs, et ne saturaient rien.
map $http_user_agent $mc_cle_robot_ia {
    default           "";
    ~*perplexitybot   perplexity;
    ~*claudebot       claude;
    ~*bytespider      bytespider;
    ~*gptbot          gptbot;
    ~*oai-searchbot   oai;
    ~*ccbot           ccbot;
    ~*amazonbot       amazonbot;
}
limit_req_zone $mc_cle_robot_ia zone=mc_robots_ia:1m rate=30r/m;
