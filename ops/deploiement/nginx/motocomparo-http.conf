# Niveau http : a copier dans /etc/nginx/conf.d/ (voir 09-durcissement.sh).
#
# Audit du 30/09/2026.

# La version exacte de nginx et de l'OS sortait dans chaque en-tete Server et
# chaque page d'erreur.
server_tokens off;

# Formulaire de contact : 3 envois par minute et par adresse, POST seulement.
# Une cle vide n'est pas comptee, donc les GET ne sont jamais freines.
map $request_method $mc_cle_contact {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $mc_cle_contact zone=mc_contact:1m rate=3r/m;

# Le robot d'entrainement de Meta explorait les combinaisons de filtres sans
# fin : pres de la moitie des requetes, pool de connexions epuise, 500 et 504
# pour les vrais visiteurs. Il n'amene aucun visiteur.
map $http_user_agent $mc_robot_refuse {
    default               0;
    ~*meta-externalagent  1;
}
