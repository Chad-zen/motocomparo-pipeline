[project]
name = "mcpipe"
version = "0.0.1"
description = "Motorcycle-gear price-comparison data pipeline (feeds -> normalized catalog -> storefront)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "psycopg[binary]>=3.2",     # PostgreSQL driver
    "httpx>=0.27",              # feed downloads (streaming)
    "charset-normalizer>=3.3",  # feed encoding detection
    "pydantic>=2.7",            # settings + typed feed config
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",       # load .env
    "typer>=0.12",              # CLI
    "rich>=13.7",               # readable console output
    "structlog>=24.1",          # structured logs

    # --- le site -----------------------------------------------------------
    # Elles manquaient : le dépôt ne déclarait que le pipeline, si bien que
    # `pip install -e .` sur un serveur neuf donnait un environnement d'où le
    # site ne pouvait pas démarrer. Constaté au premier déploiement, le
    # 2026-09-17 : systemd bouclait sur `203/EXEC`, faute d'uvicorn.
    #
    # Elles sont dans les dépendances principales et non dans un extra, parce
    # que ce dépôt EST le site autant que le pipeline : les séparer inviterait
    # à réinstaller à moitié, ce qui vient précisément d'arriver.
    "fastapi>=0.115",           # le site
    "uvicorn>=0.30",            # le serveur qui le fait tourner
    "jinja2>=3.1",              # les gabarits de pages
    "psycopg-pool>=3.2",        # `ConnectionPool` dans app.py
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-postgresql>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mcpipe = "mcpipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # word-list dictionaries read better as "a b c".split()

[tool.pytest.ini_options]
testpaths = ["tests"]
