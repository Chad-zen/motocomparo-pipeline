# Local PostgreSQL for development.
# Alternative to a native install. Run:  docker compose up -d
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: mcpipe
      POSTGRES_PASSWORD: mcpipe
      POSTGRES_DB: mcpipe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpipe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
